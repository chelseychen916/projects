<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}
#qjBanner{position:fixed;left:0;right:0;top:0;z-index:99;background:#b3261e;color:#fff;padding:12px 16px;font:15px/1.5 system-ui,sans-serif}</style>
<script>
(function(){
  var errs=[];
  function show(msg){
    var b=document.getElementById('qjBanner');
    if(!b){b=document.createElement('div');b.id='qjBanner';(document.body||document.documentElement).appendChild(b);}
    b.textContent=msg;
  }
  window.addEventListener('error',function(e){errs.push(e.message+(e.lineno?' (第 '+e.lineno+' 行)':''));show('页面出错了:'+errs[errs.length-1]+'。请把这句话截图发给我。');});
  window.addEventListener('load',function(){setTimeout(function(){
    if(!window.__qjBoot&&!errs.length)show('页面里的程序没有运行。请不要用"文件"App 的预览打开,换成 Safari、Chrome 或 Documents 的浏览器打开。');
  },1200);});
})();
</script>
<title>琴键跟弹</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Music&display=swap">
<style>
/* Layout: a quiet top bar (tabs left, metronome / microphone / display on the right), one control row, a status card
   that pairs the hand diagram with the note to play, then the staff and the note lane + keyboard.
   Colour idea: graphite-and-paper UI with a piano felt-red accent; each finger owns one colour (pink, orange, yellow,
   blue, violet) that follows it from the hand diagram to the block, the key badge and the notehead. Green and red are
   kept for right and wrong only, so no finger uses them. */
:root {
  --font: "Noto Sans SC", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --bg: #eceeeb;
  --panel: #f9faf8;
  --fg: #1b2220;
  --muted: #63706b;
  --line: #d2d8d4;
  --lane: #e2e6e2;
  --seg: #dfe3df;
  --key: #fdfdfb;
  --key-edge: #b2bab5;
  --key-text: #4a5551;
  --black: #191d1c;
  --accent: #1b2220;
  --on-accent: #f4f6f3;
  --felt: #b23a3a;
  --on-felt: #ffffff;
  --press: #b9c6cf;
  --ok: #2e8b57;
  --ok-on: #ffffff;
  --bad: #c93c3c;
  --bad-on: #ffffff;
  --warn: #a9680b;
  --on-color: #101412;
  --f1: #cf4b8d; --f1-on: #ffffff;
  --f2: #e5832e; --f2-on: #101412;
  --f3: #d6b21f; --f3-on: #101412;
  --f4: #3b82c4; --f4-on: #ffffff;
  --f5: #7c5cbf; --f5-on: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121615; --panel: #1b2120; --fg: #e7ece9; --muted: #92a09a; --line: #2b3431; --lane: #161c1b; --seg: #232b29;
    --key: #e9ede9; --key-edge: #7a8681; --key-text: #3a4440; --black: #070908;
    --accent: #e7ece9; --on-accent: #121615; --felt: #e0605c; --on-felt: #1a0b0b; --press: #4b5d69;
    --ok: #52c58a; --ok-on: #0c1f15; --bad: #ff7a76; --bad-on: #2a0b0b; --warn: #f0b04a; --on-color: #101412;
    --f1: #ec6fae; --f1-on: #1d0a14; --f2: #f0a04b; --f2-on: #1c1004; --f3: #e8c84a; --f3-on: #1c1604;
    --f4: #62a3e6; --f4-on: #08162a; --f5: #a58be0; --f5-on: #130b26;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121615; --panel: #1b2120; --fg: #e7ece9; --muted: #92a09a; --line: #2b3431; --lane: #161c1b; --seg: #232b29;
  --key: #e9ede9; --key-edge: #7a8681; --key-text: #3a4440; --black: #070908;
  --accent: #e7ece9; --on-accent: #121615; --felt: #e0605c; --on-felt: #1a0b0b; --press: #4b5d69;
  --ok: #52c58a; --ok-on: #0c1f15; --bad: #ff7a76; --bad-on: #2a0b0b; --warn: #f0b04a; --on-color: #101412;
  --f1: #ec6fae; --f1-on: #1d0a14; --f2: #f0a04b; --f2-on: #1c1004; --f3: #e8c84a; --f3-on: #1c1604;
  --f4: #62a3e6; --f4-on: #08162a; --f5: #a58be0; --f5-on: #130b26;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.45;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:disabled { opacity: .45; cursor: not-allowed; }
select, input, textarea { font: inherit; color: var(--fg); }
:focus-visible { outline: 2px solid var(--felt); outline-offset: 2px; }
h1, h2 { text-wrap: balance; }
.app { height: 100%; display: flex; flex-direction: column; gap: 12px; padding-block: 12px; box-sizing: border-box; }
.view { display: flex; flex-direction: column; gap: 12px; flex: 1; }
.view[hidden] { display: none; }

/* top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 22px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { margin: 0; font: 700 21px/1 var(--serif); letter-spacing: .08em; }
.mark { width: 32px; height: 22px; display: block; }
.tabs { display: flex; gap: 2px; }
.tab { min-height: 44px; padding: 0 16px; border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: transparent; color: var(--muted); font-size: 16px; font-weight: 500; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--felt); font-weight: 700; }
.tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.popwrap { position: relative; }
.ibtn {
  min-height: 44px; min-width: 44px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
}
.ibtn svg { width: 22px; height: 22px; flex: none; }
.ibtn .mini { font: 600 14px var(--mono); font-variant-numeric: tabular-nums; }
.ibtn.active { border-color: var(--fg); }
.ibtn[aria-pressed="true"] { border-color: var(--fg); }
.ibtn .state { font-size: 14px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
#mic[aria-pressed="true"] .dot { background: var(--ok); box-shadow: 0 0 0 3px rgb(46 139 87 / .25); }
#metroOpen.active .dot { background: var(--felt); }
.pop {
  position: absolute; right: 0; top: calc(100% + 8px); z-index: 20; width: min(330px, calc(100vw - 32px)); box-sizing: border-box;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px;
  box-shadow: 0 14px 40px rgb(0 0 0 / .18); display: flex; flex-direction: column; gap: 14px;
}
.pop[hidden] { display: none; }
.pop h3 { margin: 0; font: 700 15px var(--font); color: var(--muted); letter-spacing: .04em; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }

/* shared controls */
.btn {
  min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel);
  font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--felt); border-color: var(--felt); color: var(--on-felt); font-weight: 700; }
.btn[aria-pressed="true"].tog { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--seg); border-radius: 12px; }
.seg[hidden] { display: none; }
.seg button { min-height: 38px; min-width: 56px; padding: 0 14px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 700; }
.songsel { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font: 700 16px var(--serif); max-width: 100%; }
.stepper { display: inline-flex; align-items: center; gap: 6px; }
.stepper button { min-width: 44px; min-height: 44px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font-size: 20px; }
.stepper output { min-width: 3.2ch; text-align: center; font: 600 26px var(--mono); font-variant-numeric: tabular-nums; }
.unit { color: var(--muted); font-size: 13px; }
input[type="range"] { accent-color: var(--felt); min-height: 32px; }
.bds { display: flex; gap: 8px; }
.bd { width: 14px; height: 14px; border-radius: 50%; background: var(--line); display: inline-block; }
.bd.on { background: var(--fg); }
.bd.acc.on { background: var(--felt); }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.controls .spacer { flex: 1; }

/* status card */
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 28px; padding: 10px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; min-height: 76px; }
.handcard { display: flex; align-items: center; gap: 12px; }
.handcard[hidden] { display: none; }
.hands { display: flex; gap: 4px; }
.hands svg { flex: none; overflow: visible; }
.hands .palm { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
.hands .hl { fill: var(--muted); font: 500 10px var(--font); text-anchor: middle; }
.hands .fg { --fc: var(--muted); --fon: var(--panel); transition: transform .12s; }
.hands .fg[data-f="1"] { --fc: var(--f1); --fon: var(--f1-on); }
.hands .fg[data-f="2"] { --fc: var(--f2); --fon: var(--f2-on); }
.hands .fg[data-f="3"] { --fc: var(--f3); --fon: var(--f3-on); }
.hands .fg[data-f="4"] { --fc: var(--f4); --fon: var(--f4-on); }
.hands .fg[data-f="5"] { --fc: var(--f5); --fon: var(--f5-on); }
.hands .fg rect { fill: var(--fc); fill-opacity: .22; stroke: var(--fc); stroke-width: 1.6; }
.hands .fg text { fill: var(--fg); font: 700 11px var(--mono); text-anchor: middle; }
.hands .fg.on { transform: translateY(6px); }
.hands .fg.on rect { fill-opacity: 1; }
.hands .fg.on text { fill: var(--fon); }
#handCap { min-width: 8.5em; font-size: 14px; color: var(--muted); }
.now { display: flex; align-items: baseline; gap: 10px; }
.now .lab { color: var(--muted); font-size: 13px; }
.now b { font: 700 32px/1 var(--serif); min-width: 2.2em; }
.judge { min-width: 8em; font: 600 20px var(--mono); font-variant-numeric: tabular-nums; }
.judge.ok { color: var(--ok); }
.judge.warn { color: var(--warn); }
.judge.bad { color: var(--bad); }
.prog { display: flex; align-items: center; gap: 10px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
.progbar { width: 120px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.progbar i { display: block; height: 100%; width: 0; background: var(--fg); transition: width .2s; }
.miccard { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 10px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
.miccard[hidden] { display: none; }
.heard { display: flex; align-items: center; gap: 10px; color: var(--muted); }
.heard b { color: var(--fg); min-width: 2.6em; font: 600 18px var(--mono); }
.meter { width: 90px; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--ok); }
.mic-opts { display: flex; align-items: center; gap: 14px; color: var(--muted); }
.mic-opts label, .heard label { display: flex; align-items: center; gap: 6px; }
.micdbg { flex-basis: 100%; color: var(--muted); font: 500 12px var(--mono); }
.micdbg:empty { display: none; }
.msg { color: var(--bad); min-height: 0; }
.msg:empty { display: none; }

/* staff + stage */
.score { position: relative; flex: none; height: 128px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); overflow: hidden; }
.score.grand { height: 228px; }
.score[hidden] { display: none; }
#staff { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage { position: relative; flex: 1; min-height: 300px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--lane); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.done {
  position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); width: min(420px, calc(100% - 32px));
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px; text-align: center;
  box-shadow: 0 12px 40px rgb(0 0 0 / .25);
}
.done[hidden] { display: none; }
.done h2 { margin: 0 0 6px; font: 700 24px var(--serif); }
.done p { margin: 4px 0; color: var(--muted); }
.done .row { justify-content: center; margin-top: 16px; }

/* song library */
.lib { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 400px); gap: 20px 24px; align-content: start; }
.h2 { margin: 0 0 12px; font: 700 20px var(--serif); }
.songgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.songcard { display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); min-width: 0; }
.songcard.cur { border-color: var(--fg); }
.songcard h3 { margin: 0; font: 700 18px/1.25 var(--serif); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 2px 9px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; color: var(--muted); }
.best { font: 500 12px var(--mono); color: var(--muted); }
.songcard .row { margin-top: auto; }
.songcard .btn { min-height: 40px; padding: 0 14px; }
.addcard { display: flex; flex-direction: column; gap: 12px; padding: 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); align-self: start; }
.addcard label { display: flex; flex-direction: column; gap: 6px; color: var(--muted); }
.addcard input, .addcard textarea, .addcard select { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; box-sizing: border-box; }
.addcard textarea { resize: vertical; min-height: 120px; font-family: var(--mono); }
.hint { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.65; }
.info { margin: 0; min-height: 1.4em; color: var(--ok); }
.info.err { color: var(--bad); }
.libfoot { grid-column: 1 / -1; margin: 0; font-size: 13px; color: var(--muted); }
@media (max-width: 900px) { .lib { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { .progbar i, .hands .fg { transition: none; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 22" aria-hidden="true">
        <rect x="1" y="1" width="30" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M8 1v20M16 1v20M24 1v20" stroke="currentColor" stroke-width="1.2"/>
        <rect x="5.5" y="1" width="5" height="12" rx="1" fill="currentColor"/>
        <rect x="13.5" y="1" width="5" height="12" rx="1" fill="currentColor"/>
        <rect x="21.5" y="1" width="5" height="12" rx="1" fill="currentColor"/>
        <rect x="1" y="1" width="30" height="2.4" fill="var(--felt)"/>
      </svg>
      <h1>琴键跟弹</h1>
    </div>
    <nav class="tabs" role="tablist" aria-label="页面">
      <button type="button" class="tab" role="tab" id="tabPlay" aria-selected="true">跟练</button>
      <button type="button" class="tab" role="tab" id="tabLib" aria-selected="false">曲库</button>
    </nav>
    <div class="tools">
      <div class="popwrap">
        <button type="button" class="ibtn" id="metroOpen" data-pop="metroPop" aria-expanded="false" aria-label="节拍器">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 21h7L14 5h-4z"/><path d="M12 15l4-9"/><path d="M10.5 11h3"/></svg>
          <span class="mini" id="bpmMini">80</span>
        </button>
        <div class="pop" id="metroPop" hidden>
          <h3>节拍器</h3>
          <div class="row between">
            <button type="button" id="metroBtn" class="btn primary" aria-pressed="false">开始</button>
            <span class="bds" id="bds" aria-hidden="true"><i class="bd acc"></i><i class="bd"></i><i class="bd"></i><i class="bd"></i></span>
          </div>
          <div class="row between">
            <div class="stepper">
              <button type="button" id="bpmDn" aria-label="慢一点">−</button>
              <output id="bpmOut" for="bpmDn bpmUp">80</output>
              <button type="button" id="bpmUp" aria-label="快一点">+</button>
            </div>
            <span class="unit">拍/分</span>
          </div>
          <input type="range" id="bpmRange" min="40" max="160" step="5" value="80" aria-label="速度">
          <div class="row between">
            <label for="beats" class="unit">每小节</label>
            <select id="beats" class="songsel" style="font:500 15px var(--font)">
              <option value="2">2 拍</option><option value="3">3 拍</option><option value="4" selected>4 拍</option>
            </select>
            <button type="button" id="metroSnd" class="btn tog" aria-pressed="true">声音</button>
          </div>
        </div>
      </div>
      <button type="button" class="ibtn" id="mic" aria-pressed="false" aria-label="麦克风听音">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
        <span class="dot"></span><span class="state micstate">听音</span>
      </button>
      <div class="popwrap">
        <button type="button" class="ibtn" id="viewOpen" data-pop="viewPop" aria-expanded="false" aria-label="显示设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h8M16 7h4M4 12h3M11 12h9M4 17h10M18 17h2"/><circle cx="14" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="16" cy="17" r="2"/></svg>
        </button>
        <div class="pop" id="viewPop" hidden>
          <h3>显示</h3>
          <div class="row between"><span>五线谱</span><button type="button" id="stf" class="btn tog" aria-pressed="true">显示</button></div>
          <div class="row between"><span>指法与手型</span><button type="button" id="fing" class="btn tog" aria-pressed="true">显示</button></div>
        </div>
      </div>
    </div>
  </header>

  <section id="viewPlay" class="view" aria-label="跟练">
    <div class="controls">
      <select id="song" class="songsel" aria-label="曲目"></select>
      <div class="seg" role="group" aria-label="音符标注方式">
        <button type="button" data-n="name" aria-pressed="true">键名</button>
        <button type="button" data-n="num" aria-pressed="false">简谱</button>
        <button type="button" data-n="solfege" aria-pressed="false">唱名</button>
      </div>
      <div class="seg" id="handSeg" role="group" aria-label="练习哪只手">
        <button type="button" data-h="R" aria-pressed="true">右手</button>
        <button type="button" data-h="L" aria-pressed="false">左手</button>
        <button type="button" data-h="B" aria-pressed="false">双手</button>
      </div>
      <div class="seg" id="lhSeg" role="group" aria-label="左手弹法" hidden>
        <button type="button" data-l="root" aria-pressed="true">根音</button>
        <button type="button" data-l="chord" aria-pressed="false">和弦</button>
      </div>
      <div class="seg" id="modeSeg" role="group" aria-label="练习方式">
        <button type="button" data-m="follow" aria-pressed="true">跟弹</button>
        <button type="button" data-m="rhythm" aria-pressed="false">节奏</button>
      </div>
      <button type="button" id="go" class="btn primary" hidden>开始</button>
      <span class="spacer"></span>

      var tr = ev.tones.filter(function (t) { return t.h !== 'L'; }), ba = ev.tones.filter(function (t) { return t.h === 'L'; });
      // the note to play now is drawn in its finger's colour, so the staff, the key and the hand diagram all agree
      if (tr.length && bots.treble !== undefined) drawGroup(it.x, tr, color, i === hi, 'treble', bots.treble, i === hi ? tr.map(fingerColor) : null);
      if (ba.length && bots.bass !== undefined) drawGroup(it.x, ba, color, i === hi, 'bass', bots.bass, i === hi ? ba.map(fingerColor) : null);
      if (ev.name && view.hand !== 'R') {
        sx.fillStyle = col.fg; sx.font = '700 14px ' + col.font; sx.textAlign = 'center'; sx.textBaseline = 'middle';
        sx.fillText(ev.name, it.x, 16);
      }
    });
    sx.fillStyle = col.muted; sx.font = '12px ' + col.font; sx.textAlign = 'right'; sx.textBaseline = 'top';
    sx.fillText((li + 1) + ' / ' + lines.length, SW - 12, 4);
  }
  function applyStaff() {
    $('stf').setAttribute('aria-pressed', staffOn ? 'true' : 'false');
    $('score').hidden = !staffOn;
    $('score').classList.toggle('grand', view.hand === 'B');
    if (staffOn) layoutStaff();
  }
  $('stf').addEventListener('click', function () { staffOn = !staffOn; lsSet('qj_staff', staffOn ? '1' : '0'); applyStaff(); });
  new ResizeObserver(layoutStaff).observe($('score'));

  /* ---------- custom songs (pasted 简谱) ---------- */
  function parseJianpu(text, tonic) {
    var re = /([#b♯♭]?)([1-7])(['’′,，]*)/g, base = [0, 2, 4, 5, 7, 9, 11], out = [], mm;
    while ((mm = re.exec(text))) {
      var pc = base[+mm[2] - 1];
      if (mm[1] === '#' || mm[1] === '♯') pc++; else if (mm[1]) pc--;
      var oct = 0;
      mm[3].split('').forEach(function (ch) { oct += (ch === ',' || ch === '，') ? -1 : 1; });
      out.push(60 + tonic + pc + 12 * oct);
    }
    return out;
  }
  function checkRange(notes) {
    var lo = Math.min.apply(null, notes), hi = Math.max.apply(null, notes);
    var low = Math.floor(lo / 12) * 12, octs = Math.max(2, Math.ceil((hi - low + 1) / 12));
    return { lo: lo, hi: hi, low: low, octs: octs, ok: octs <= 3 };
  }
  function loadCustom() {
    var raw = []; try { raw = JSON.parse(lsGet('qj_custom') || '[]'); } catch (e) {}
    raw.forEach(function (c) {
      var notes = parseJianpu(c.text, c.tonic);
      if (notes.length && checkRange(notes).ok)
        SONGS.push({ id: c.id, title: c.title, notes: notes, custom: true, tonic: c.tonic, raw: c });
    });
  }
  function saveCustom() {
    lsSet('qj_custom', JSON.stringify(SONGS.filter(function (s) { return s.custom; }).map(function (s) { return s.raw; })));
  }
  function refreshSongSelect() {
    $('song').innerHTML = '';
    SONGS.forEach(function (sg, i) {
      var o = document.createElement('option'); o.value = i; o.textContent = sg.title; $('song').appendChild(o);
    });
  }
  function previewAdd() {
    var info = $('addInfo'), notes = parseJianpu($('txt').value, parseInt($('tonic').value, 10));
    info.classList.remove('err');
    if (!$('txt').value.trim()) { info.textContent = ''; return null; }
    if (!notes.length) { info.classList.add('err'); info.textContent = '没有识别到音符,请检查写法。'; return null; }
    var r = checkRange(notes);
    if (!r.ok) { info.classList.add('err'); info.textContent = '音域超过三个八度(' + noteName(r.lo) + ' 到 ' + noteName(r.hi) + '),请换简单版或换个调。'; return null; }
    info.textContent = '识别到 ' + notes.length + ' 个音,音域 ' + noteName(r.lo) + ' 到 ' + noteName(r.hi) + '。';
    return notes;
  }
  $('addCancel').addEventListener('click', function () { $('nm').value = ''; $('txt').value = ''; $('addInfo').textContent = ''; });
  $('txt').addEventListener('input', previewAdd);
  $('tonic').addEventListener('change', previewAdd);
  $('addForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var notes = previewAdd(), title = $('nm').value.trim();
    if (!title) { $('addInfo').classList.add('err'); $('addInfo').textContent = '请先写上曲名。'; return; }
    if (!notes) return;
    var tonic = parseInt($('tonic').value, 10), id = 'c' + Date.now();
    var sg = { id: id, title: title, notes: notes, custom: true, tonic: tonic, raw: { id: id, title: title, tonic: tonic, text: $('txt').value } };
    SONGS.push(sg); saveCustom(); refreshSongSelect();
    $('nm').value = ''; $('txt').value = ''; $('addInfo').textContent = '';
    useSong(SONGS.length - 1); switchTab('play');
  });
  function deleteSong(s) {
    var wasCurrent = s === song;
    SONGS.splice(SONGS.indexOf(s), 1); saveCustom(); refreshSongSelect();
    if (wasCurrent) useSong(0); else $('song').value = SONGS.indexOf(song);
    renderLibrary();
  }

  /* ---------- song library tab ---------- */
  var LEVEL = { mary: '入门', bun: '入门', twinkle: '初级', ode: '初级', tigers: '初级', row: '初级', london: '初级', silent: '进阶', birthday: '进阶', canon: '进阶', elise: '进阶' };
  function mk(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function renderLibrary() {
    var box = $('songGrid'); box.textContent = '';
    SONGS.forEach(function (s, i) {
      prepareSong(s);
      var card = mk('article', 'songcard' + (s === song ? ' cur' : ''));
      card.appendChild(mk('h3', '', s.title));
      var chips = mk('div', 'chips');
      chips.appendChild(mk('span', 'chip', s.custom ? '我的曲子' : LEVEL[s.id] || '练习'));
      chips.appendChild(mk('span', 'chip', s.notes.length + ' 个音'));
      chips.appendChild(mk('span', 'chip', s.chords.length ? '含左手' : '仅右手'));
      card.appendChild(chips);
      var best = parseInt(lsGet('qj_best_' + s.id) || '-1', 10);
      card.appendChild(mk('div', 'best', best >= 0 ? '右手最好成绩 ' + best + '%' : '还没有成绩'));
      var row = mk('div', 'row');
      var go = mk('button', 'btn primary', s === song ? '继续练' : '弹这首'); go.type = 'button';
      go.addEventListener('click', function () { useSong(i); switchTab('play'); });
      row.appendChild(go);
      if (s.custom) {
        var del = mk('button', 'btn', '删除'); del.type = 'button';
        del.addEventListener('click', function () {
          if (del.dataset.sure) { deleteSong(s); return; }
          del.dataset.sure = '1'; del.textContent = '再点一次删除';
          setTimeout(function () { del.dataset.sure = ''; del.textContent = '删除'; }, 3000);
        });
        row.appendChild(del);
      }
      card.appendChild(row);
      box.appendChild(card);
    });
  }

  /* ---------- tabs and popovers ---------- */
  function switchTab(name) {
    var play = name === 'play';
    $('viewPlay').hidden = !play; $('viewLib').hidden = play;
    $('tabPlay').setAttribute('aria-selected', play ? 'true' : 'false');
    $('tabLib').setAttribute('aria-selected', play ? 'false' : 'true');
    closePops();
    if (play) { layout(); layoutStaff(); }
    else {
      if (demoTimer) stopDemo();
      if (rhy.running) { rhyStop(); resetSong(); }
      renderLibrary();
    }
  }
  function closePops() {
    document.querySelectorAll('.pop').forEach(function (p) { p.hidden = true; });
    document.querySelectorAll('[data-pop]').forEach(function (b) { b.setAttribute('aria-expanded', 'false'); });
  }
  document.querySelectorAll('[data-pop]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var p = $(btn.dataset.pop), open = p.hidden;
      closePops(); p.hidden = !open; btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  });
  document.addEventListener('click', function (e) { if (!e.target.closest('.popwrap')) closePops(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePops(); });
  $('tabPlay').addEventListener('click', function () { switchTab('play'); });
  $('tabLib').addEventListener('click', function () { switchTab('lib'); });

  /* ---------- song / hand selection ---------- */
  function syncHandUI() {
    var has = song.chords && song.chords.length > 0;
    document.querySelectorAll('#handSeg button').forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.h === hand ? 'true' : 'false');
      if (b.dataset.h !== 'R') b.disabled = !has;
      b.title = !has && b.dataset.h !== 'R' ? '这首暂时没有左手伴奏' : '';
    });
    document.querySelectorAll('#lhSeg button').forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.l === lhs ? 'true' : 'false');
    });
    $('lhSeg').hidden = hand === 'R';
  }
  function applyView() {
    view = buildView(song, hand, lhs);
    var r = viewRange(view);
    if (r.octs > 4 && hand !== 'R') {
      hand = 'R'; showMsg('这首的音域太宽,键盘放不下两只手,已切回右手。'); syncHandUI();
      view = buildView(song, hand, lhs); r = viewRange(view);
    }
    buildKeys(r.low, r.octs); layout(); applyStaff(); staffCache.key = '';
    resetSong();
    if (!$('viewLib').hidden) renderLibrary();
  }
  function useSong(i) {
    if (demoTimer) stopDemo();
    song = SONGS[i]; prepareSong(song); $('song').value = i;
    if (hand !== 'R' && !song.chords.length) hand = 'R';
    syncHandUI(); applyView();
  }
  $('song').addEventListener('change', function () { showMsg(''); useSong(parseInt($('song').value, 10)); });
  document.querySelectorAll('#handSeg button').forEach(function (b) {
    b.addEventListener('click', function () {
      if (b.disabled) return;
      showMsg(''); hand = b.dataset.h; lsSet('qj_hand', hand); syncHandUI(); if (demoTimer) stopDemo(); applyView();
    });
  });
  document.querySelectorAll('#lhSeg button').forEach(function (b) {
    b.addEventListener('click', function () {
      showMsg(''); lhs = b.dataset.l; lsSet('qj_lhs', lhs); syncHandUI(); if (demoTimer) stopDemo(); applyView();
    });
  });
  function setNotation(v) {
    notation = v; lsSet('qj_notation', v);
    document.querySelectorAll('.seg button[data-n]').forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.n === v ? 'true' : 'false');
    });
    updateStatus();
  }
  document.querySelectorAll('.seg button[data-n]').forEach(function (b) {
    b.addEventListener('click', function () { setNotation(b.dataset.n); });
  });
  function applyFing() {
    $('fing').setAttribute('aria-pressed', showFing ? 'true' : 'false');
    $('handWrap').hidden = !showFing;
  }
  $('fing').addEventListener('click', function () { showFing = !showFing; lsSet('qj_fing', showFing ? '1' : '0'); applyFing(); });
  $('demo').addEventListener('click', runDemo);
  $('restart').addEventListener('click', function () { if (demoTimer) stopDemo(); resetSong(); });
  $('again').addEventListener('click', function () { if (rhy.on) rhyStart(); else resetSong(); });
  $('next').addEventListener('click', function () { useSong((SONGS.indexOf(song) + 1) % SONGS.length); });
  $('mic').addEventListener('click', function () { if (micOn) stopMic(); else startMic(); });

  new ResizeObserver(layout).observe($('stage'));
  applyFing(); loadCustom(); refreshSongSelect();
  useSong(0); setNotation(notation);
  requestAnimationFrame(frame);
  window.__qjBoot = true;
})();
</script>
