<title>琴键跟弹</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Music&display=swap">
<style>
/* Layout: one-screen practice tool. Header bar, status row, a staff strip (treble, bass, or both),
   then a stage whose upper part is a note lane and whose lower part is the keyboard, all on one canvas
   so blocks sit exactly above their keys. Right hand = blue, left hand = teal, current target = amber. */
:root {
  --bg: #eef1f5;
  --fg: #16202b;
  --muted: #5d6b79;
  --panel: #ffffff;
  --line: #d3dae2;
  --lane: #e2e8ef;
  --key: #fbfcfd;
  --key-edge: #aab4bf;
  --key-text: #44505c;
  --black: #1b232c;
  --accent: #2457c5;
  --lh: #0e8a83;
  --on-accent: #ffffff;
  --target: #f0a020;
  --ok: #2a9d5c;
  --bad: #d64545;
  --on-color: #101418;
  --font: "Noto Sans SC", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141a; --fg: #e8edf2; --muted: #93a1b0; --panel: #18202a; --line: #2a3541;
    --lane: #131a22; --key: #e6eaee; --key-edge: #7d8895; --key-text: #3a4550; --black: #07090c;
    --accent: #6d9bff; --lh: #4fd1c5; --on-accent: #0b1220; --target: #ffb83d; --ok: #4cc884; --bad: #ff6b6b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141a; --fg: #e8edf2; --muted: #93a1b0; --panel: #18202a; --line: #2a3541;
  --lane: #131a22; --key: #e6eaee; --key-edge: #7d8895; --key-text: #3a4550; --black: #07090c;
  --accent: #6d9bff; --lh: #4fd1c5; --on-accent: #0b1220; --target: #ffb83d; --ok: #4cc884; --bad: #ff6b6b;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.app { height: 100%; display: flex; flex-direction: column; gap: 10px; padding-block: 12px; box-sizing: border-box; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.bar h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .02em; margin-right: 4px; }
.field { display: flex; align-items: center; gap: 8px; color: var(--muted); }
select, button, .seg { font: inherit; }
select {
  min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel); color: var(--fg);
}
button {
  min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel); color: var(--fg); cursor: pointer; touch-action: manipulation;
}
button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 500; }
button[aria-pressed="true"].tog { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
button:disabled { opacity: .45; cursor: not-allowed; }
select:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
.seg[hidden] { display: none; }
.seg button { border: 0; border-radius: 0; background: transparent; min-width: 60px; padding: 0 12px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 500; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); margin-right: 8px; vertical-align: 1px; }
#mic[aria-pressed="true"] .dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 30%, transparent); }

.metro { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.metro button { min-width: 44px; padding: 0 12px; }
.metro select { min-height: 44px; }
.metro output { min-width: 2.2em; text-align: center; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.metro .unit { color: var(--muted); font-size: 13px; margin-right: 4px; }
.bds { display: flex; gap: 7px; padding: 0 8px; }
.bd { width: 13px; height: 13px; border-radius: 50%; background: var(--line); display: inline-block; }
.bd.on { background: var(--accent); }
.bd.acc.on { background: var(--target); }

.status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px; min-height: 40px; }
.hands { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.hands[hidden] { display: none; }
.hands svg { flex: none; overflow: visible; }
.hands .palm { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
.hands .fg rect { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
.hands .fg text { fill: var(--muted); font: 700 11px var(--font); text-anchor: middle; }
.hands .fg { transition: transform .12s; }
.hands .fg.on { transform: translateY(6px); }
.hands .fg.on rect { fill: var(--target); stroke: var(--target); }
.hands .fg.on text { fill: var(--on-color); }
#hL .palm { stroke: var(--lh); }
#hR .palm { stroke: var(--accent); }
#handCap { min-width: 9em; font-size: 14px; }
.want { display: flex; align-items: baseline; gap: 8px; color: var(--muted); }
.want b { font-size: 26px; line-height: 1; color: var(--fg); min-width: 2.2em; font-weight: 700; }
.judge { min-width: 9em; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.judge.ok { color: var(--ok); }
.judge.warn { color: var(--target); }
.judge.bad { color: var(--bad); }
.prog { display: flex; align-items: center; gap: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.progbar { width: 120px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.progbar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.heard { display: none; align-items: center; gap: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.heard.on { display: flex; }
.heard b { color: var(--fg); min-width: 2.6em; font-size: 18px; }
.meter { width: 90px; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--ok); }
.mic-opts { display: none; align-items: center; gap: 14px; color: var(--muted); }
.mic-opts.on { display: flex; flex-wrap: wrap; }
.mic-opts label { display: flex; align-items: center; gap: 6px; }
.micdbg { flex-basis: 100%; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.micdbg:empty { display: none; }
.msg { color: var(--bad); flex-basis: 100%; min-height: 0; }
.msg:empty { display: none; }

.score { position: relative; flex: none; height: 128px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); overflow: hidden; }
.score.grand { height: 228px; }
.score[hidden] { display: none; }
#staff { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.stage { position: relative; flex: 1; min-height: 300px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--lane); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.done {
  position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); width: min(420px, calc(100% - 32px));
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px; text-align: center;
  box-shadow: 0 12px 40px rgb(0 0 0 / .25);
}
.done[hidden] { display: none; }
.done h2 { margin: 0 0 6px; font-size: 22px; }
.done p { margin: 4px 0; color: var(--muted); }
.done .row { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
.foot { color: var(--muted); font-size: 13px; }

.modal { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgb(0 0 0 / .45); }
.modal[hidden] { display: none; }
.modal .card { width: min(500px, 100%); max-height: 100%; overflow: auto; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
.modal h2 { margin: 0; font-size: 20px; }
.modal label { display: flex; flex-direction: column; gap: 6px; color: var(--muted); }
.modal input, .modal textarea, .modal select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; box-sizing: border-box; }
.modal textarea { resize: vertical; min-height: 120px; }
.modal .hint { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; }
.modal .info { margin: 0; min-height: 1.4em; color: var(--ok); }
.modal .info.err { color: var(--bad); }
.modal .row { display: flex; gap: 10px; justify-content: flex-end; }
@media (prefers-reduced-motion: reduce) { .progbar i, .hands .fg { transition: none; } }
</style>

<div class="app">
  <header class="bar">
    <h1>琴键跟弹</h1>
    <label class="field"><span>曲目</span><select id="song"></select></label>
    <div class="seg" role="group" aria-label="音符标注方式">
      <button type="button" data-n="name" aria-pressed="true">键名</button>
      <button type="button" data-n="num" aria-pressed="false">简谱</button>
      <button type="button" data-n="solfege" aria-pressed="false">唱名</button>
    </div>
    <div class="seg" id="handSeg" role="group" aria-label="练习哪只手">
      <button type="button" data-h="R" aria-pressed="true">右手</button>
      <button type="button" data-h="L" aria-pressed="false">左手</button>
      <button type="button" data-h="B" aria-pressed="false">双手</button>
    </div>
    <div class="seg" id="lhSeg" role="group" aria-label="左手弹法" hidden>
      <button type="button" data-l="root" aria-pressed="true">根音</button>
      <button type="button" data-l="chord" aria-pressed="false">和弦</button>
    </div>
    <div class="metro" role="group" aria-label="节拍器">
      <button type="button" id="metroBtn" class="tog" aria-pressed="false">节拍器</button>
      <button type="button" id="bpmDn" aria-label="慢一点">−</button>
      <output id="bpmOut" for="bpmDn bpmUp">80</output><span class="unit">拍/分</span>
      <button type="button" id="bpmUp" aria-label="快一点">+</button>
      <select id="beats" aria-label="每小节拍数">
        <option value="2">2 拍</option><option value="3">3 拍</option><option value="4" selected>4 拍</option>
      </select>
      <span class="bds" id="bds" aria-hidden="true"><i class="bd acc"></i><i class="bd"></i><i class="bd"></i><i class="bd"></i></span>
      <button type="button" id="metroSnd" class="tog" aria-pressed="true">声音</button>
    </div>
    <div class="actions">
      <button type="button" id="rhy" class="tog" aria-pressed="false">节奏模式</button>
      <button type="button" id="go" class="primary" hidden>开始</button>
      <button type="button" id="add">添加曲子</button>
      <button type="button" id="delSong" hidden>删除这首</button>
      <button type="button" id="stf" class="tog" aria-pressed="true">五线谱</button>
      <button type="button" id="fing" class="tog" aria-pressed="true">指法</button>
      <button type="button" id="demo">听示范</button>
      <button type="button" id="restart">重来</button>
      <button type="button" id="mic" class="tog" aria-pressed="false"><span class="dot"></span>麦克风听音</button>
    </div>
  </header>

  <section class="status" aria-live="polite">
    <div class="hands" id="handWrap">
      <svg id="hL" viewBox="0 0 120 84" width="92" height="64" aria-hidden="true"></svg>
      <svg id="hR" viewBox="0 0 120 84" width="92" height="64" aria-hidden="true"></svg>
      <div id="handCap">手指提示</div>
    </div>
    <div class="want">现在弹 <b id="want">—</b></div>
    <div class="judge" id="judge" role="status"></div>
    <div class="prog"><span id="progText"></span><div class="progbar"><i id="progFill"></i></div></div>
    <div class="heard" id="heard">听到 <b id="heardNote">—</b><div class="meter"><i id="lvl"></i></div>
      <label for="sens" style="display:flex;align-items:center;gap:6px">灵敏度 <input type="range" id="sens" min="1" max="8" value="5" style="width:130px"></label>
    </div>
    <div class="mic-opts" id="micOpts">
      <label for="anyOct"><input type="checkbox" id="anyOct" checked> 不分高低八度</label>
    </div>
    <div class="micdbg" id="micDbg"></div>
    <div class="msg" id="msg" role="status"></div>
  </section>

  <div class="score" id="score"><canvas id="staff" aria-label="五线谱"></canvas></div>

  <main class="stage" id="stage">
    <canvas id="cv" aria-label="琴键和音符提示"></canvas>
    <div class="done" id="done" hidden>
      <h2>弹完了</h2>
      <p id="doneText"></p>
      <p id="doneBest"></p>
      <div class="row">
        <button type="button" class="primary" id="again">再弹一遍</button>
        <button type="button" id="next">下一首</button>
      </div>
    </div>
  </main>
  <div class="foot">没有开麦克风时:点屏幕琴键(可以多指同时按),或用电脑键盘 A S D F G H J 弹最左边八度的白键,Q W E R T Y U 弹右边一个八度。 · 页面版本 v13</div>
</div>

<div class="modal" id="addModal" hidden>
  <form class="card" id="addForm">
    <h2>添加曲子</h2>
    <label for="nm">曲名<input id="nm" type="text" maxlength="30" autocomplete="off" placeholder="例如 我的练习曲"></label>
    <label for="tonic">调(1 = )
      <select id="tonic">
        <option value="0">C</option><option value="1">♭D</option><option value="2">D</option><option value="3">♭E</option>
        <option value="4">E</option><option value="5">F</option><option value="6">♯F</option><option value="7">G</option>
        <option value="8">♭A</option><option value="9">A</option><option value="10">♭B</option><option value="11">B</option>
      </select>
    </label>
    <label for="txt">简谱<textarea id="txt" placeholder="例如:3 3 2 1 | 2 2 1 6, | ..."></textarea></label>
    <p class="hint">写法:数字 1 到 7。高八度加 ' (如 1'),低八度加 , (如 6,),升半音前加 # (如 #4)。空格、竖线、横线和休止符 0 会被忽略。现在只管音高,每个音按 1 拍,左手伴奏会自动配和弦。建议找 C 调的简单版简谱,最好弹。</p>
    <p class="info" id="addInfo" role="status"></p>
    <div class="row">
      <button type="button" id="addCancel">取消</button>
      <button type="submit" class="primary" id="addSave">保存并开始</button>
    </div>
  </form>
</div>

<script>
//<pitch>
function detectPitch(buf, sr, thr) {
  var W = 2048, tauMin = Math.floor(sr / 1200), tauMax = Math.ceil(sr / 70);
  var start = buf.length - W - tauMax - 1;
  if (start < 0) return null;
  var d = new Float32Array(tauMax + 2), tau, j, diff, sum;
  for (tau = 1; tau <= tauMax + 1 && start + W + tau <= buf.length; tau++) {
    sum = 0;
    for (j = 0; j < W; j++) { diff = buf[start + j] - buf[start + j + tau]; sum += diff * diff; }
    d[tau] = sum;
  }
  var cm = new Float32Array(tauMax + 2), run = 0;
  cm[0] = 1;
  for (tau = 1; tau <= tauMax + 1; tau++) {
    run += d[tau];
    cm[tau] = run === 0 ? 1 : d[tau] * tau / run;
  }
  var found = -1;
  for (tau = tauMin; tau <= tauMax; tau++) {
    if (cm[tau] < (thr || 0.12)) {
      while (tau + 1 <= tauMax && cm[tau + 1] < cm[tau]) tau++;
      found = tau; break;
    }
  }
  if (found < 0) return null;
  var a = cm[found - 1], b = cm[found], c = cm[found + 1];
  var den = a - 2 * b + c, shift = den !== 0 ? 0.5 * (a - c) / den : 0;
  var freq = sr / (found + shift);
  return { freq: freq, midi: 69 + 12 * Math.log2(freq / 440) };
}
// Are all of these notes sounding? db = analyser.getFloatFrequencyData() output. A note counts as present when its spectral
// peak stands well above the noise floor and is not tiny next to the loudest peak (so one note's overtones don't pass as a chord).
function chordPresent(db, sr, fftSize, midis, anyOct) {
  var binHz = sr / fftSize, lo = Math.max(1, Math.floor(90 / binHz)), hi = Math.min(db.length - 2, Math.ceil(1500 / binHz));
  var mags = [], i, mx = 0;
  for (i = lo; i <= hi; i++) { var v = Math.pow(10, db[i] / 20); mags.push(v); if (v > mx) mx = v; }
  var sorted = mags.slice().sort(function (a, b) { return a - b; });
  var floor = sorted[Math.floor(sorted.length * 0.5)] || 1e-9;
  function mag(k) { return Math.pow(10, db[k] / 20); }
  // The peak must be a local maximum of its own, not just the skirt of a louder neighbouring note.
  function peakAt(f) {
    var c = Math.round(f / binHz), best = 0;
    for (var k = c - 1; k <= c + 1; k++) {
      if (k < lo + 2 || k > hi - 2) continue;
      var v = mag(k);
      if (v >= mag(k - 1) && v >= mag(k + 1) && v >= mag(k - 2) && v >= mag(k + 2)) best = Math.max(best, v);
    }
    return best;
  }
  return midis.every(function (m) {
    var f = 440 * Math.pow(2, (m - 69) / 12), freqs = [];
    if (anyOct) { for (var o = -3; o <= 3; o++) { var ff = f * Math.pow(2, o); if (ff >= 90 && ff <= 1500) freqs.push(ff); } }
    else if (f >= 90 && f <= 1500) freqs.push(f);
    return freqs.some(function (ff) { var p = peakAt(ff); return p > floor * 8 && p > mx * 0.15; });
  });
}
// Frequency of the loudest spectral peak (for the on-screen diagnostics).
function strongest(db, sr, fftSize) {
  var binHz = sr / fftSize, lo = Math.max(1, Math.floor(70 / binHz)), hi = Math.min(db.length - 2, Math.ceil(3000 / binHz)), best = lo;
  for (var i = lo; i <= hi; i++) if (db[i] > db[best]) best = i;
  return best * binHz;
}
// Pitch from the harmonic series: score every candidate note by how many of its overtones show up as spectral peaks.
// Works when a small microphone has cut the fundamental, because the overtones still line up.
function detectPitchSpec(db, sr, fftSize) {
  var binHz = sr / fftSize, n = db.length, i, mag = new Float32Array(n);
  for (i = 0; i < n; i++) mag[i] = Math.pow(10, db[i] / 20);
  var lo = Math.max(2, Math.floor(70 / binHz)), hi = Math.min(n - 2, Math.ceil(3000 / binHz)), arr = [];
  for (i = lo; i <= hi; i++) arr.push(mag[i]);
  arr.sort(function (a, b) { return a - b; });
  var floor = arr[Math.floor(arr.length * 0.5)] || 1e-9, best = -1, bestSc = 0;
  for (var m = 36; m <= 96; m++) {
    var f0 = 440 * Math.pow(2, (m - 69) / 12), sc = 0, hits = 0;
    for (var h = 1; h <= 6; h++) {
      var f = f0 * h;
      if (f > 3000) break;
      var c = Math.round(f / binHz), pk = 0;
      for (var k = c - 1; k <= c + 1; k++) if (k > 1 && k < n - 1 && mag[k] > pk) pk = mag[k];
      var v = pk / floor;
      if (v > 6) { sc += Math.log(v) / h; hits++; }
    }
    if (hits >= 2 && sc > bestSc) { bestSc = sc; best = m; }
  }
  return best < 0 ? null : { midi: best, freq: 440 * Math.pow(2, (best - 69) / 12) };
}
//</pitch>
</script>

    if (!satisfied(ev, 350, now)) { midis.forEach(function (mm) { flash(mm, 'demo', 250); }); return; }
    var ms = Math.round(d * 60000 / metro.bpm), perfect = Math.abs(d) <= win * 0.5;
    rhy.res[j] = { s: perfect ? 'perfect' : 'good', d: d };
    ev.tones.forEach(function (t) { flash(t.m, 'ok', 350); });
    recent = {};
    setJudge(perfect ? '准 ' + fmtMs(ms) : (d < 0 ? '偏早 ' : '偏晚 ') + fmtMs(ms), perfect ? 'ok' : 'warn');
  }
  function rhyLock(on) {
    ['bpmDn', 'bpmUp', 'beats', 'metroBtn'].forEach(function (id) { $(id).disabled = on; });
  }
  function rhyStart() {
    if (demoTimer) stopDemo();
    var c = audio();
    buildTimeline(); recent = {}; $('done').hidden = true; setJudge('', '');
    if (metro.on) { clearInterval(metro.timer); metro.timer = null; metro.on = false; }
    metro.beats = view.bar; $('beats').value = String(view.bar);
    rhy.t0 = performance.now() + 400; rhy.running = true;
    metro.beat = 0; metro.next = c.currentTime + 0.4; metro.on = true;
    metro.timer = setInterval(metroSched, 25); metroSched();
    rhyLock(true); $('go').textContent = '停止'; syncMetroUI(); updateStatus();
  }
  function rhyStop() {
    if (rhy.running) {
      rhy.running = false;
      if (metro.on) { clearInterval(metro.timer); metro.timer = null; metro.on = false; }
      rhyLock(false); syncMetroUI();
    }
    $('go').textContent = '开始';
  }
  function rhyFinish() {
    var n = rhy.res.length, p = 0, g = 0, mi = 0, sum = 0, cnt = 0;
    rhy.res.forEach(function (r) {
      if (!r) return;
      if (r.s === 'perfect') p++; else if (r.s === 'good') g++; else mi++;
      if (r.d !== undefined) { sum += r.d; cnt++; }
    });
    rhyStop();
    var pct = Math.round((p + 0.6 * g) / n * 100), avg = cnt ? Math.round(sum / cnt * 60000 / metro.bpm) : 0;
    var key = 'qj_rbest_' + song.id + (hand === 'R' ? '' : '_' + hand + lhs), prev = parseInt(lsGet(key) || '-1', 10);
    if (pct > prev) lsSet(key, String(pct));
    $('doneText').textContent = '准 ' + p + ' · 还行 ' + g + ' · 漏 ' + mi + '(共 ' + n + ' 步)';
    $('doneBest').textContent = '节奏得分 ' + pct + '%' + (cnt ? ',平均' + (avg > 0 ? '偏晚 ' : '偏早 ') + Math.abs(avg) + ' 毫秒' : '')
      + (pct > prev ? '(新纪录)' : '(最好 ' + prev + '%)');
    $('done').hidden = false; setJudge('完成', 'ok'); setHands(null);
  }
  $('rhy').addEventListener('click', function () {
    rhy.on = !rhy.on;
    $('rhy').setAttribute('aria-pressed', rhy.on ? 'true' : 'false');
    $('go').hidden = !rhy.on;
    if (demoTimer) stopDemo();
    resetSong();
  });
  $('go').addEventListener('click', function () { if (rhy.running) { rhyStop(); resetSong(); } else rhyStart(); });

  /* ---------- staff notation (treble, bass, or both) ---------- */
  var sc = $('staff'), sx = sc.getContext('2d'), SW = 0, SH = 0, clefOk = false;
  var SP = 11, SX0 = 74, staffCache = { key: '', lines: [], lineOf: [] };
  var CLEF = { treble: { bs: 37, glyph: '\u{1D11E}', fb: 'G', refLine: 1 }, bass: { bs: 25, glyph: '\u{1D122}', fb: 'F', refLine: 3 } };
  if (document.fonts && document.fonts.load) {
    document.fonts.load('58px "Noto Music"', '\u{1D11E}\u{1D122}').then(function () {
      clefOk = document.fonts.check('58px "Noto Music"', '\u{1D11E}');
    }).catch(function () {});
  }
  function layoutStaff() {
    var r = $('score').getBoundingClientRect();
    if (!r.width) return;
    var d = window.devicePixelRatio || 1;
    SW = r.width; SH = r.height;
    sc.width = Math.round(SW * d); sc.height = Math.round(SH * d);
    sx.setTransform(d, 0, 0, d, 0, 0);
  }
  function staffBottoms() {
    if (view.hand === 'B') return { treble: 86, bass: 86 + 4 * SP + 52 };
    return view.hand === 'L' ? { bass: 86 } : { treble: 86 };
  }
  function staffLines() {
    var key = song.id + ':' + hand + lhs + ':' + Math.round(SW) + ':' + view.events.length;
    if (staffCache.key === key) return staffCache.lines;
    var lines = [], lineOf = [], cur = { items: [], bars: [] }, x = SX0, evs = view.events;
    evs.forEach(function (ev, i) {
      var nx = evs[i + 1], gap = nx ? nx.on - ev.on : Math.max.apply(null, ev.tones.map(function (t) { return t.d; }));
      var sharp = ev.tones.some(function (t) { return NAMES[t.m % 12].length > 1; });
      var w = 30 + 20 * Math.min(gap, 3) + (sharp ? 9 : 0);
      if (x + w > SW - 16 && cur.items.length) { lines.push(cur); cur = { items: [], bars: [] }; x = SX0; }
      cur.items.push({ i: i, x: x + w / 2 + (sharp ? 4 : 0) }); lineOf[i] = lines.length; x += w;
      var endOn = nx ? nx.on : ev.on + gap, bound = (Math.floor(ev.on / view.bar + 1e-6) + 1) * view.bar;
      if (endOn >= bound - 1e-6) { cur.bars.push(x + 2); x += 8; }
    });
    lines.push(cur);
    staffCache = { key: key, lines: lines, lineOf: lineOf };
    return lines;
  }
  function noteKind(d) {
    if (d >= 4) return { hollow: true, stem: false, flags: 0, dot: false };
    if (d >= 3) return { hollow: true, stem: true, flags: 0, dot: true };
    if (d >= 2) return { hollow: true, stem: true, flags: 0, dot: false };
    if (d >= 1.5) return { hollow: false, stem: true, flags: 0, dot: true };
    if (d >= 1) return { hollow: false, stem: true, flags: 0, dot: false };
    if (d >= 0.75) return { hollow: false, stem: true, flags: 1, dot: true };
    if (d >= 0.5) return { hollow: false, stem: true, flags: 1, dot: false };
    return { hollow: false, stem: true, flags: 2, dot: false };
  }
  /* One staff's worth of tones at one x: heads, ledger lines, accidentals, one shared stem. */
  function drawGroup(x, tones, color, outline, clef, bottom) {
    var bs = CLEF[clef].bs, k = noteKind(tones[0].d), s, ys = [], steps = [];
    function yOf(step) { return bottom - (step - bs) * SP / 2; }
    tones.forEach(function (t) { steps.push(whiteNo(t.m)); });
    sx.strokeStyle = col.muted; sx.lineWidth = 1.2;
    tones.forEach(function (t, q) {
      var step = steps[q], y = yOf(step); ys.push(y);
      if (step <= bs - 2) for (s = bs - 2; s >= step; s -= 2) { sx.beginPath(); sx.moveTo(x - 11, yOf(s)); sx.lineTo(x + 11, yOf(s)); sx.stroke(); }
      if (step >= bs + 10) for (s = bs + 10; s <= step; s += 2) { sx.beginPath(); sx.moveTo(x - 11, yOf(s)); sx.lineTo(x + 11, yOf(s)); sx.stroke(); }
      if (NAMES[t.m % 12].length > 1) {
        sx.fillStyle = color; sx.font = '700 17px ' + col.font; sx.textAlign = 'center'; sx.textBaseline = 'middle';
        sx.fillText('♯', x - 17, y);
      }
      sx.save(); sx.translate(x, y); sx.rotate(-0.35); sx.beginPath(); sx.ellipse(0, 0, 6.6, 4.8, 0, 0, 6.283);
      if (k.hollow) { sx.lineWidth = 1.8; sx.strokeStyle = color; sx.stroke(); }
      else { sx.fillStyle = color; sx.fill(); if (outline) { sx.lineWidth = 1; sx.strokeStyle = col.fg; sx.stroke(); } }
      sx.restore();
      if (k.dot) { sx.fillStyle = color; sx.beginPath(); sx.arc(x + 12, step % 2 ? y - SP / 2 : y, 2, 0, 6.283); sx.fill(); }
    });
    if (k.stem) {
      var avg = steps.reduce(function (a, b) { return a + b; }, 0) / steps.length, up = avg < bs + 4;
      var yTop = Math.min.apply(null, ys), yBot = Math.max.apply(null, ys);
      var xs = up ? x + 5.9 : x - 5.9, y1 = up ? yBot : yTop, y2 = up ? yTop - 3.5 * SP : yBot + 3.5 * SP;
      sx.strokeStyle = color; sx.lineWidth = 1.4; sx.beginPath(); sx.moveTo(xs, y1); sx.lineTo(xs, y2); sx.stroke();
      for (var f = 0; f < k.flags; f++) {
        var o = f * 6 * (up ? 1 : -1);
        sx.lineWidth = 2; sx.beginPath(); sx.moveTo(xs, y2 + o);
        sx.quadraticCurveTo(xs + 11, y2 + o + (up ? 8 : -8), xs + 7, y2 + o + (up ? 18 : -18)); sx.stroke();
      }
    }
  }
  function drawStaff() {
    if (!SW || !view.events.length) return;
    var lines = staffLines(), n = view.events.length, evs = view.events, bots = staffBottoms();
    var hi = demoTimer ? demoI - 1 : curTI;
    var cur = rhy.on ? (rhy.running ? (firstOpen() < 0 ? n - 1 : firstOpen()) : 0)
      : (demoTimer ? Math.max(0, demoI - 1) : (done ? n - 1 : Math.min(idx, n - 1)));
    var li = staffCache.lineOf[cur] || 0, L = lines[li], clefs = Object.keys(bots);
    var topY = Math.min.apply(null, clefs.map(function (c) { return bots[c] - 4 * SP; }));
    var botY = Math.max.apply(null, clefs.map(function (c) { return bots[c]; }));
    sx.clearRect(0, 0, SW, SH); sx.fillStyle = col.panel; sx.fillRect(0, 0, SW, SH);
    clefs.forEach(function (c) {
      var bt = bots[c];
      sx.strokeStyle = col.muted; sx.lineWidth = 1; sx.globalAlpha = 0.75;
      for (var k = 0; k < 5; k++) { sx.beginPath(); sx.moveTo(10, bt - k * SP); sx.lineTo(SW - 10, bt - k * SP); sx.stroke(); }
      sx.globalAlpha = 1; sx.fillStyle = col.fg;
      var cy = bt - CLEF[c].refLine * SP;
      if (clefOk) { sx.font = '58px "Noto Music"'; sx.textAlign = 'left'; sx.textBaseline = 'alphabetic'; sx.fillText(CLEF[c].glyph, 16, cy); }
      else { sx.font = 'italic 700 40px serif'; sx.textAlign = 'left'; sx.textBaseline = 'middle'; sx.fillText(CLEF[c].fb, 24, cy); }
    });
    sx.strokeStyle = col.fg; sx.lineWidth = 1.5;
    if (clefs.length > 1) { sx.beginPath(); sx.moveTo(10, topY); sx.lineTo(10, botY); sx.stroke(); }
    L.bars.forEach(function (bx) { sx.beginPath(); sx.moveTo(bx, topY); sx.lineTo(bx, botY); sx.stroke(); });
    L.items.forEach(function (it) {
      var i = it.i, ev = evs[i], color = col.fg, r = rhy.res[i];
      if (rhy.on) { if (r) color = r.s === 'miss' ? col.bad : col.ok; }
      else if (i < idx || done) color = col.ok;
      if (i === hi) {
        sx.globalAlpha = 0.22; sx.fillStyle = col.target; sx.fillRect(it.x - 22, topY - 24, 44, botY - topY + 50); sx.globalAlpha = 1;
        color = col.target;
      }
      var tr = ev.tones.filter(function (t) { return t.h !== 'L'; }), ba = ev.tones.filter(function (t) { return t.h === 'L'; });
      if (tr.length && bots.treble !== undefined) drawGroup(it.x, tr, color, i === hi, 'treble', bots.treble);
      if (ba.length && bots.bass !== undefined) drawGroup(it.x, ba, color, i === hi, 'bass', bots.bass);
      if (ev.name && view.hand !== 'R') {
        sx.fillStyle = col.lh; sx.font = '700 14px ' + col.font; sx.textAlign = 'center'; sx.textBaseline = 'middle';
        sx.fillText(ev.name, it.x, 16);
      }
    });
    sx.fillStyle = col.muted; sx.font = '12px ' + col.font; sx.textAlign = 'right'; sx.textBaseline = 'top';
    sx.fillText((li + 1) + ' / ' + lines.length, SW - 12, 4);
  }
  function applyStaff() {
    $('stf').setAttribute('aria-pressed', staffOn ? 'true' : 'false');
    $('score').hidden = !staffOn;
    $('score').classList.toggle('grand', view.hand === 'B');
    if (staffOn) layoutStaff();
  }
  $('stf').addEventListener('click', function () { staffOn = !staffOn; lsSet('qj_staff', staffOn ? '1' : '0'); applyStaff(); });
  new ResizeObserver(layoutStaff).observe($('score'));

  /* ---------- custom songs (pasted 简谱) ---------- */
  function parseJianpu(text, tonic) {
    var re = /([#b♯♭]?)([1-7])(['’′,，]*)/g, base = [0, 2, 4, 5, 7, 9, 11], out = [], mm;
    while ((mm = re.exec(text))) {
      var pc = base[+mm[2] - 1];
      if (mm[1] === '#' || mm[1] === '♯') pc++; else if (mm[1]) pc--;
      var oct = 0;
      mm[3].split('').forEach(function (ch) { oct += (ch === ',' || ch === '，') ? -1 : 1; });
      out.push(60 + tonic + pc + 12 * oct);
    }
    return out;
  }
  function checkRange(notes) {
    var lo = Math.min.apply(null, notes), hi = Math.max.apply(null, notes);
    var low = Math.floor(lo / 12) * 12, octs = Math.max(2, Math.ceil((hi - low + 1) / 12));
    return { lo: lo, hi: hi, low: low, octs: octs, ok: octs <= 3 };
  }
  function loadCustom() {
    var raw = []; try { raw = JSON.parse(lsGet('qj_custom') || '[]'); } catch (e) {}
    raw.forEach(function (c) {
      var notes = parseJianpu(c.text, c.tonic);
      if (notes.length && checkRange(notes).ok)
        SONGS.push({ id: c.id, title: c.title, notes: notes, custom: true, tonic: c.tonic, raw: c });
    });
  }
  function saveCustom() {
    lsSet('qj_custom', JSON.stringify(SONGS.filter(function (s) { return s.custom; }).map(function (s) { return s.raw; })));
  }
  function refreshSongSelect() {
    $('song').innerHTML = '';
    SONGS.forEach(function (sg, i) {
      var o = document.createElement('option'); o.value = i; o.textContent = sg.title; $('song').appendChild(o);
    });
  }
  function previewAdd() {
    var info = $('addInfo'), notes = parseJianpu($('txt').value, parseInt($('tonic').value, 10));
    info.classList.remove('err');
    if (!$('txt').value.trim()) { info.textContent = ''; return null; }
    if (!notes.length) { info.classList.add('err'); info.textContent = '没有识别到音符,请检查写法。'; return null; }
    var r = checkRange(notes);
    if (!r.ok) { info.classList.add('err'); info.textContent = '音域超过三个八度(' + noteName(r.lo) + ' 到 ' + noteName(r.hi) + '),请换简单版或换个调。'; return null; }
    info.textContent = '识别到 ' + notes.length + ' 个音,音域 ' + noteName(r.lo) + ' 到 ' + noteName(r.hi) + '。';
    return notes;
  }
  $('add').addEventListener('click', function () { $('addModal').hidden = false; $('nm').focus(); });
  $('addCancel').addEventListener('click', function () { $('addModal').hidden = true; });
  $('txt').addEventListener('input', previewAdd);
  $('tonic').addEventListener('change', previewAdd);
  $('addForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var notes = previewAdd(), title = $('nm').value.trim();
    if (!title) { $('addInfo').classList.add('err'); $('addInfo').textContent = '请先写上曲名。'; return; }
    if (!notes) return;
    var tonic = parseInt($('tonic').value, 10), id = 'c' + Date.now();
    var sg = { id: id, title: title, notes: notes, custom: true, tonic: tonic, raw: { id: id, title: title, tonic: tonic, text: $('txt').value } };
    SONGS.push(sg); saveCustom(); refreshSongSelect();
    $('addModal').hidden = true; $('nm').value = ''; $('txt').value = ''; $('addInfo').textContent = '';
    useSong(SONGS.length - 1);
  });
  $('delSong').addEventListener('click', function () {
    if (!song.custom) return;
    SONGS.splice(SONGS.indexOf(song), 1); saveCustom(); refreshSongSelect(); useSong(0);
  });

  /* ---------- song / hand selection ---------- */
  function syncHandUI() {
    var has = song.chords && song.chords.length > 0;
    document.querySelectorAll('#handSeg button').forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.h === hand ? 'true' : 'false');
      if (b.dataset.h !== 'R') b.disabled = !has;
      b.title = !has && b.dataset.h !== 'R' ? '这首暂时没有左手伴奏' : '';
    });
    document.querySelectorAll('#lhSeg button').forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.l === lhs ? 'true' : 'false');
    });
    $('lhSeg').hidden = hand === 'R';
  }
  function applyView() {
    view = buildView(song, hand, lhs);
    var r = viewRange(view);
    if (r.octs > 4 && hand !== 'R') {
      hand = 'R'; showMsg('这首的音域太宽,键盘放不下两只手,已切回右手。'); syncHandUI();
      view = buildView(song, hand, lhs); r = viewRange(view);
    }
    buildKeys(r.low, r.octs); layout(); applyStaff(); staffCache.key = '';
    resetSong(); $('delSong').hidden = !song.custom;
  }
  function useSong(i) {
    if (demoTimer) stopDemo();
    song = SONGS[i]; prepareSong(song); $('song').value = i;
    if (hand !== 'R' && !song.chords.length) hand = 'R';
    syncHandUI(); applyView();
  }
  $('song').addEventListener('change', function () { showMsg(''); useSong(parseInt($('song').value, 10)); });
  document.querySelectorAll('#handSeg button').forEach(function (b) {
    b.addEventListener('click', function () {
      if (b.disabled) return;
      showMsg(''); hand = b.dataset.h; lsSet('qj_hand', hand); syncHandUI(); if (demoTimer) stopDemo(); applyView();
    });
  });
  document.querySelectorAll('#lhSeg button').forEach(function (b) {
    b.addEventListener('click', function () {
      showMsg(''); lhs = b.dataset.l; lsSet('qj_lhs', lhs); syncHandUI(); if (demoTimer) stopDemo(); applyView();
    });
  });
  function setNotation(v) {
    notation = v; lsSet('qj_notation', v);
    document.querySelectorAll('.seg button[data-n]').forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.n === v ? 'true' : 'false');
    });
    updateStatus();
  }
  document.querySelectorAll('.seg button[data-n]').forEach(function (b) {
    b.addEventListener('click', function () { setNotation(b.dataset.n); });
  });
  function applyFing() {
    $('fing').setAttribute('aria-pressed', showFing ? 'true' : 'false');
    $('handWrap').hidden = !showFing;
  }
  $('fing').addEventListener('click', function () { showFing = !showFing; lsSet('qj_fing', showFing ? '1' : '0'); applyFing(); });
  $('demo').addEventListener('click', runDemo);
  $('restart').addEventListener('click', function () { if (demoTimer) stopDemo(); resetSong(); });
  $('again').addEventListener('click', function () { if (rhy.on) rhyStart(); else resetSong(); });
  $('next').addEventListener('click', function () { useSong((SONGS.indexOf(song) + 1) % SONGS.length); });
  $('mic').addEventListener('click', function () { if (micOn) stopMic(); else startMic(); });

  new ResizeObserver(layout).observe($('stage'));
  applyFing(); loadCustom(); refreshSongSelect();
  useSong(0); setNotation(notation);
  requestAnimationFrame(frame);
  window.__qjBoot = true;
})();
</script>
